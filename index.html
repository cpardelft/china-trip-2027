<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>China Family Journey 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: porcelain sheet; slim header with live total, tab bar, then one working view at a time (route map, day planner, budget, essentials, customise). */
:root{
  --paper:#F5F7FA; --sheet:#FFFFFF; --ink:#16213A; --muted:#5B6578; --line:#DCE2EC;
  --cobalt:#1F4FA3; --cobalt-soft:#E4ECF9; --jade:#2C7A66; --jade-soft:#E1F1EC;
  --cinnabar:#B8432C; --cinnabar-soft:#F8E6E1; --amber:#9A6A12; --amber-soft:#F7EED9;
  --road:#7A8496; --plum:#7B3F8C; --teal:#1C7F8F;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1320; --sheet:#151D2D; --ink:#E5EAF3; --muted:#9AA5B8; --line:#26324A;
  --cobalt:#86AAF2; --cobalt-soft:#1B2A48; --jade:#5FC3A8; --jade-soft:#14302A;
  --cinnabar:#F0846C; --cinnabar-soft:#3A1F1A; --amber:#E2B65C; --amber-soft:#33291A; --road:#8D97AA; --plum:#C995D8; --teal:#5CC6D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1320; --sheet:#151D2D; --ink:#E5EAF3; --muted:#9AA5B8; --line:#26324A;
  --cobalt:#86AAF2; --cobalt-soft:#1B2A48; --jade:#5FC3A8; --jade-soft:#14302A;
  --cinnabar:#F0846C; --cinnabar-soft:#3A1F1A; --amber:#E2B65C; --amber-soft:#33291A; --road:#8D97AA; --plum:#C995D8; --teal:#5CC6D6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1}
h2{font-size:24px;line-height:1.2}
h3{font-size:18px;line-height:1.3}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

/* header */
header.top{padding-top:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.seal{display:inline-grid;place-items:center;width:34px;height:34px;border:1.5px solid var(--cinnabar);color:var(--cinnabar);font-family:var(--f-display);font-size:18px;border-radius:4px;margin-right:10px;vertical-align:middle}
.sub{margin-top:8px;color:var(--muted)}
.total{text-align:right}
.total .big{font-family:var(--f-display);font-size:clamp(28px,4.5vw,40px);line-height:1}
.total .small{font-size:13px;color:var(--muted);margin-top:4px}
@media (max-width:640px){header.top{grid-template-columns:1fr}.total{text-align:left}}

.controls{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:18px;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);align-items:center}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ctl input{width:78px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--f-mono)}
.ctl select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-top:18px;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--cobalt)}
nav.tabs a:hover{color:var(--ink)}
section.view{padding-top:26px}

/* route */
.route-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.route-grid{grid-template-columns:1fr}}
.mapbox{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.mapbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:6px 6px 2px}
.legend i{display:inline-block;width:22px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:6px}
.city-list{display:flex;flex-direction:column;gap:10px}
.city{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);cursor:pointer;text-align:left;width:100%}
.city:hover,.city.on{border-color:var(--cobalt)}
.city .dot{width:12px;height:12px;border-radius:50%;margin-top:6px}
.city .nights{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.city p{font-size:13.5px;color:var(--muted);margin-top:2px}
.leg-strip{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.leg{padding:12px 14px;border-radius:var(--r);background:var(--sheet);border:1px solid var(--line);font-size:13.5px}
.leg b{font-weight:600}

/* days */
.timeline{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.dchip{flex:0 0 auto;scroll-snap-align:start;min-width:74px;padding:8px 10px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;cursor:pointer;text-align:left}
.dchip .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dchip .c{font-size:13px;font-weight:600;margin-top:2px;white-space:nowrap}
.dchip .bar{height:3px;border-radius:2px;margin-top:6px}
.dchip.on{border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt) inset}
.day{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
@media (max-width:860px){.day{grid-template-columns:1fr}}
.dayhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.dayhead .when{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.dayintro{margin-top:8px;max-width:65ch;color:var(--muted)}
.transport{margin-top:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet)}
.mode{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:99px}
.m-flight{background:var(--cobalt-soft);color:var(--cobalt)}
.m-rail{background:var(--jade-soft);color:var(--jade)}
.m-road{background:var(--paper);color:var(--road);border:1px solid var(--line)}
.m-none{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.items{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);align-items:start}
.item.off{opacity:.55}
.item.off .iname{text-decoration:line-through}
.item input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--cobalt)}
.iname{font-weight:600}
.idesc{font-size:13.5px;color:var(--muted);margin-top:3px;max-width:62ch}
.itip{font-size:12.5px;margin-top:6px;color:var(--amber)}
.kind{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;margin-right:8px}
.k-see{color:var(--cobalt)} .k-do{color:var(--jade)} .k-eat{color:var(--cinnabar)}
.cost{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cost input{width:76px;text-align:right;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--f-mono);font-size:13px}
.cost .eur{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.del{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.del:hover{color:var(--cinnabar)}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.kv .v{font-family:var(--f-mono);text-align:right}
.kv .sum{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.addform{display:grid;gap:8px}
.addform input,.addform select,.addform textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--cobalt);background:var(--cobalt);color:var(--sheet);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cobalt)}
.btn.warn{border-color:var(--cinnabar);color:var(--cinnabar);background:transparent}
.navbtns{display:flex;justify-content:space-between;margin-top:16px;gap:8px}

/* budget */
.bgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.bgrid{grid-template-columns:1fr}}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;font-size:14px}
@media (max-width:520px){.brow{grid-template-columns:1fr 80px}.brow .track{grid-column:1/-1;order:3}}
.track{height:12px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .35s ease}
.brow .v{font-family:var(--f-mono);text-align:right}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td input{width:72px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--f-mono);text-align:right}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.stat .v{font-family:var(--f-display);font-size:24px;margin-top:2px}
.note{font-size:13px;color:var(--muted);margin-top:10px;max-width:70ch}

/* essentials */
.ess{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin-bottom:8px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.card.alert{border-color:var(--cinnabar);background:var(--cinnabar-soft)}
.card.alert h3{color:var(--cinnabar)}
.book{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.book .w{font-family:var(--f-mono);font-size:12.5px;color:var(--cobalt);white-space:nowrap}
.src{font-size:12.5px;color:var(--muted);margin-top:16px}
.src a{color:var(--cobalt)}

/* weather */
.wx-strip{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:10px 14px;border-radius:var(--r);background:var(--cobalt-soft);font-size:13.5px}
.wx-strip b{font-family:var(--f-mono);font-weight:500}
.wx-strip .t{color:var(--muted);flex-basis:100%}
.chart{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow-x:auto}
.chart svg{width:100%;min-width:480px;height:auto;display:block}
.wxcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:22px}
.wxc{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.wxc .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wxc .dates{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wxnums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wxnums div{background:var(--paper);border-radius:8px;padding:8px}
.wxnums .v{font-family:var(--f-mono);font-size:16px}
.wxnums .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wxc p{font-size:14px}
.wxc .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:block}
/* hotels */
.hbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.staynav{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:6px}
.staynav a{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);text-decoration:none;color:var(--ink);font-size:13px;max-width:220px}
.staynav a i{width:8px;height:8px;border-radius:50%}
.staynav a span{color:var(--muted);font-size:12px}
.staynav a b{grid-column:1/-1;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stay{margin-top:34px;scroll-margin-top:60px}
.stayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.staydates{color:var(--muted);font-size:13px;margin-top:4px}
.stepper{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--sheet)}
.stepper button{width:30px;height:30px;border-radius:50%;border:none;background:var(--paper);cursor:pointer;font-size:17px;line-height:1}
.stepper button:hover{background:var(--cobalt-soft);color:var(--cobalt)}
.stepper .num{font-size:16px;min-width:1.2em;text-align:center}
.stepper .muted{font-size:13px;margin-right:4px}
.arrlv{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:13.5px;color:var(--muted);margin-top:10px}
.arrlv b{color:var(--ink);font-weight:600;margin-right:4px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:14px}
.hcard{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,box-shadow .2s,transform .2s}
.hcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px -14px var(--ink)}
.hcard.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.hhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.hhead h3{margin-top:4px}
.harea{font-size:13px;color:var(--muted);margin-top:2px}
.htype{display:inline-block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:99px}
.t-family{background:var(--jade-soft);color:var(--jade)}
.t-apartment{background:var(--cobalt-soft);color:var(--cobalt)}
.t-rooms{background:var(--amber-soft);color:var(--amber)}
.t-custom{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.hscore{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.hscore .num{display:inline-grid;place-items:center;min-width:46px;height:38px;padding:0 8px;border-radius:10px 10px 10px 2px;background:var(--t);color:var(--sheet);font-size:17px;font-weight:500}
.hscore small{font-size:11px;color:var(--muted);white-space:nowrap}
.halt{font-size:12px;color:var(--muted);margin-top:-6px}
.hroom{font-size:13.5px;background:var(--paper);border-radius:8px;padding:10px}
.hroom .lab,.hacc dt{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hroom .lab{display:block;margin-bottom:2px}
.hroom .units{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.hacc{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0;font-size:13px}
.hacc dt{padding-top:2px}
.hacc dd{margin:0}
.hwhy{font-size:13.5px;color:var(--muted)}
.hfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.hprice{display:flex;flex-direction:column;gap:4px}
.hprice input{width:96px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--f-mono)}
.htot{font-size:18px;text-align:right}
.htot small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}
.hactions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.pill-on{display:inline-flex;align-items:center;padding:7px 12px;border-radius:8px;background:var(--c);color:var(--sheet);font-weight:600;font-size:14px}
.hlink{font-size:13px;color:var(--cobalt)}
.hadd{margin-top:12px;font-size:14px}
.hadd summary{cursor:pointer;color:var(--cobalt);font-weight:500}
.hadd form{margin-top:10px;max-width:560px}
.tonight{margin-top:12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet)}
.tonight .moon{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--cinnabar-soft);color:var(--cinnabar)}
.tonight a{font-size:13px;color:var(--cobalt);white-space:nowrap}
/* customise */
textarea.json{width:100%;min-height:200px;font-family:var(--f-mono);font-size:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Family journey · 4 travellers · Amsterdam ⇄ China</div>
      <h1 style="margin-top:8px"><span class="seal" aria-hidden="true">旅</span>Three weeks across China</h1>
      <p class="sub" id="datesLine"></p>
    </div>
    <div class="total">
      <div class="eyebrow">Estimated total</div>
      <div class="big num" id="grandTotal">€0</div>
      <div class="small" id="grandPP"></div>
    </div>
  </header>

  <div class="controls" role="group" aria-label="Trip settings">
    <label class="ctl" for="cTravellers">Travellers <input id="cTravellers" type="number" min="1" max="12"></label>

let S;
function clone(o){return JSON.parse(JSON.stringify(o))}
function hydrate(d){if(!d.stays)d.stays=clone(STAYS);syncNights(d);d.days.forEach((day,i)=>{day.id=day.id||'d'+i;day.items.forEach((it,j)=>{it.id=it.id||('i'+i+'_'+j);if(it.on===undefined)it.on=true;})});return d}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.days&&d.cities&&d.settings)return hydrate(d)}}catch(e){}return hydrate(clone(DEFAULT))}
function syncNights(d){d.cities.forEach(c=>{c.nights=d.stays.filter(s=>s.city===c.id).reduce((a,s)=>a+s.nights,0)})}
function selOpt(st){return st.opts.find(o=>o.id===st.sel)||st.opts[0]}
function stayNights(){let n=1;return S.stays.map(st=>{const r={st,from:n};n+=st.nights;return r})}
function stayForNight(i){const r=stayNights().find(x=>i>=x.from&&i<x.from+x.st.nights);return r?r.st:null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
let selDay=0, selCity=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dateOf(i){const d=new Date(S.settings.start+'T12:00:00');d.setDate(d.getDate()+i);return d}
const fmtDate=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function money(eur){const c=S.settings.currency;const v=c==='CNY'?eur*S.settings.rate:eur;return (c==='CNY'?'¥':'€')+Math.round(v).toLocaleString('en-GB')}
const cnyToEur=c=>c/S.settings.rate;
function cityById(id){return S.cities.find(c=>c.id===id)}
function cityName(id){return id==='air'?'In the air':(cityById(id)?.name||id)}

function calc(){
 const s=S.settings,T=s.travellers;
 const flights=s.flightPP*T;
 const hotels=S.stays.reduce((a,st)=>a+st.nights*selOpt(st).price,0);
 const intercity=S.days.reduce((a,d)=>a+cnyToEur((+d.t.cny||0)*T),0);
 const local=cnyToEur(s.localCNY);
 const activities=S.days.reduce((a,d)=>a+d.items.filter(i=>i.on).reduce((b,i)=>b+cnyToEur((+i.c||0)*T),0),0);
 const nDays=S.days.length-1;
 const food=s.foodPP*nDays*T;
 const extras=s.extrasPP*T;
 const sub=flights+hotels+intercity+local+activities+food+extras;
 const cont=sub*s.contingency/100;
 return {cats:[
   {k:'Flights Europe ⇄ China',v:flights,col:'var(--cobalt)'},
   {k:'Hotels',v:hotels,col:'var(--cinnabar)'},
   {k:'Food and drinks',v:food,col:'var(--amber)'},
   {k:'Sights and activities',v:activities,col:'var(--jade)'},
   {k:'Trains and domestic flights',v:intercity,col:'var(--cobalt)'},
   {k:'Local transport',v:local,col:'var(--road)'},
   {k:'eSIM, insurance top-up',v:extras,col:'var(--road)'},
   {k:'Contingency ('+s.contingency+'%)',v:cont,col:'var(--muted)'}],
  total:sub+cont,nDays};
}
function dayCost(d){const T=S.settings.travellers;return cnyToEur(((+d.t.cny||0)+d.items.filter(i=>i.on).reduce((a,i)=>a+(+i.c||0),0))*T)}

function renderHeader(){
 const r=calc(),s=S.settings;
 $('#grandTotal').textContent=money(r.total);
 $('#grandPP').textContent=money(r.total/s.travellers)+' per person · '+S.days.length+' days, '+S.cities.reduce((a,c)=>a+c.nights,0)+' nights';
 $('#datesLine').textContent=S.cities.map(c=>c.name).join(' · ')+'. '+fmtDate(dateOf(0))+' to '+fmtDate(dateOf(S.days.length-1))+' 2027';
 $('#cTravellers').value=s.travellers;$('#cRate').value=s.rate;$('#cFlight').value=s.flightPP;$('#cCur').value=s.currency;
}

/* ---------- Route ---------- */
function proj(lat,lon){return [30+(lon-102)/22*540, 30+(42-lat)/18*360]}
function renderRoute(){
 const pts=S.cities.map(c=>({c,p:proj(c.lat,c.lon)}));
 let g='';
 for(let lon=105;lon<=124;lon+=5){const x=proj(30,lon)[0];g+=`<line x1="${x}" y1="20" x2="${x}" y2="400" stroke="var(--line)" stroke-width="1"/><text x="${x+3}" y="412" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${lon}°E</text>`}
 for(let lat=25;lat<=40;lat+=5){const y=proj(lat,110)[1];g+=`<line x1="20" y1="${y}" x2="580" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="24" y="${y-4}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${lat}°N</text>`}
 // legs between consecutive cities
 const legs=[];const order=S.days.map(d=>d.city).filter(c=>c!=='air');
 for(let i=1;i<order.length;i++){if(order[i]!==order[i-1]){const day=S.days.find((d,j)=>d.city===order[i]&&(j===0||S.days[j-1].city!==order[i]));legs.push({a:order[i-1],b:order[i],mode:day?day.t.mode:'rail',label:day?day.t.label:''})}}
 let lines='';
 legs.forEach(l=>{const A=cityById(l.a),B=cityById(l.b);if(!A||!B)return;const [x1,y1]=proj(A.lat,A.lon),[x2,y2]=proj(B.lat,B.lon);
  const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,off=l.mode==='flight'?-0.22*len:-0.08*len;
  const cx=mx+(-dy/len)*off,cy=my+(dx/len)*off;
  const col=l.mode==='flight'?'var(--cobalt)':l.mode==='rail'?'var(--jade)':'var(--road)';
  lines+=`<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="2.5" ${l.mode==='flight'?'stroke-dasharray="6 6"':''} stroke-linecap="round"/>`;
 });
 // intl arrows
 const B=proj(39.9,116.4),SH=proj(31.23,121.47);
 lines+=`<path d="M${B[0]-150},${B[1]-50} Q${B[0]-70},${B[1]-70} ${B[0]-8},${B[1]-6}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 5"/><text x="${B[0]-196}" y="${B[1]-56}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans,sans-serif">from Amsterdam</text>`;
 lines+=`<path d="M${SH[0]},${SH[1]+8} Q${SH[0]+10},${SH[1]+60} ${SH[0]-30},${SH[1]+92}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 5"/><text x="${SH[0]-120}" y="${SH[1]+104}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans,sans-serif">home to Amsterdam</text>`;
 let dots='';
 pts.forEach(({c,p})=>{const on=selCity===c.id;const lx=c.id==='shanghai'?-12:12,anchor=c.id==='shanghai'?'end':'start';
  dots+=`<g class="mapcity" data-city="${c.id}" style="cursor:pointer" tabindex="0" role="button" aria-label="${esc(c.name)}">
   <circle cx="${p[0]}" cy="${p[1]}" r="${on?13:10}" fill="var(--sheet)" stroke="${CITY_COLORS[c.id]||'var(--cobalt)'}" stroke-width="3"/>
   <circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${CITY_COLORS[c.id]||'var(--cobalt)'}"/>
   <text x="${p[0]+lx}" y="${p[1]-14}" text-anchor="${anchor}" font-size="15" fill="var(--ink)" font-family="Young Serif,Georgia,serif">${esc(c.name)}</text>
   <text x="${p[0]+lx}" y="${p[1]+22}" text-anchor="${anchor}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${esc(c.zh||'')} · ${c.nights} nights</text></g>`});
 const legCards=legs.map(l=>{const d=S.days.find(x=>x.city===l.b&&x.t.label===l.label);return `<div class="leg"><span class="mode m-${l.mode}">${l.mode==='rail'?'Train':l.mode==='flight'?'Flight':'Road'}</span><div style="margin-top:6px"><b>${esc(cityName(l.a))} → ${esc(cityName(l.b))}</b></div><div class="muted">${esc(l.label)}${d?' · '+money(cnyToEur(d.t.cny*S.settings.travellers))+' for the group':''}</div></div>`}).join('');
 $('#v-route').innerHTML=`
 <div class="route-grid">
  <div class="mapbox">
   <svg viewBox="0 0 600 420" role="img" aria-label="Route map of the four cities">${g}${lines}${dots}</svg>
   <div class="legend"><span><i style="border-color:var(--jade)"></i>High-speed rail</span><span><i style="border-color:var(--cobalt);border-top-style:dashed"></i>Domestic flight</span><span><i style="border-color:var(--muted);border-top-style:dotted"></i>International flight</span></div>
  </div>
  <div class="city-list">
   <div class="eyebrow">Tap a city to open its days</div>
   ${S.cities.map(c=>`<button class="city ${selCity===c.id?'on':''}" data-city="${c.id}"><span class="dot" style="background:${CITY_COLORS[c.id]||'var(--cobalt)'}"></span><span><h3>${esc(c.name)}</h3><p>${esc(c.blurb)}</p><p style="margin-top:6px"><span class="eyebrow">Stay</span> ${esc(c.area)}</p></span><span class="nights">${c.nights} nights</span></button>`).join('')}
  </div>
 </div>
 <div class="leg-strip">${legCards}</div>`;
 document.querySelectorAll('#v-route [data-city]').forEach(el=>{const go=()=>{selCity=el.dataset.city;const i=S.days.findIndex(d=>d.city===selCity);if(i>=0)selDay=i;location.hash='days'};el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
}

/* ---------- Days ---------- */
const KIND={see:'Must see',do:'Must do',eat:'Eat'};
function renderDays(){
 selDay=Math.max(0,Math.min(selDay,S.days.length-1));
 const d=S.days[selDay];
 const chips=S.days.map((x,i)=>`<button class="dchip ${i===selDay?'on':''}" data-i="${i}"><div class="d">Day ${i+1} · ${dateOf(i).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div><div class="c">${esc(cityName(x.city))}</div><div class="bar" style="background:${CITY_COLORS[x.city]||'var(--cobalt)'}"></div></button>`).join('');
 const T=S.settings.travellers;
 const items=d.items.map((it,j)=>`<div class="item ${it.on?'':'off'}">
   <input type="checkbox" id="on_${it.id}" data-j="${j}" class="tog" ${it.on?'checked':''} aria-label="Include ${esc(it.n)}">
   <div><div><span class="kind k-${it.k}">${KIND[it.k]||it.k}</span><span class="iname">${esc(it.n)}</span></div><div class="idesc">${esc(it.d)}</div>${it.tip?`<div class="itip">${esc(it.tip)}</div>`:''}</div>
   <div class="cost"><label class="eyebrow" for="c_${it.id}">¥ pp</label><input id="c_${it.id}" type="number" min="0" data-j="${j}" class="icost" value="${+it.c||0}"><span class="eur">${money(cnyToEur((+it.c||0)*T))} group</span><button class="del" data-j="${j}">Remove</button></div></div>`).join('');
 const c=cityById(d.city);
 const hs=stayForNight(selDay),ho=hs?selOpt(hs):null;
 $('#v-days').innerHTML=`
 <div class="timeline" id="tl">${chips}</div>
 <div class="day">
  <div style="min-width:0">
   <div class="dayhead"><span class="when">Day ${selDay+1} · ${fmtDate(dateOf(selDay))}</span><span class="eyebrow" style="color:${CITY_COLORS[d.city]}">${esc(cityName(d.city))}</span></div>

function cityDates(id){const idx=S.days.map((d,i)=>d.city===id?i:-1).filter(i=>i>=0);if(!idx.length)return '';const f=dateOf(idx[0]),l=dateOf(idx[idx.length-1]);const o={day:'numeric',month:'short'};return f.toLocaleDateString('en-GB',o)+(idx.length>1?' – '+l.toLocaleDateString('en-GB',o):'')}
function renderWeather(){
 const cs=S.cities.filter(c=>c.w);
 const W=600,rowH=40,top=34,left=150,right=24,tMin=15,tMax=40;
 const x=t=>left+(t-tMin)/(tMax-tMin)*(W-left-right);
 const H=top+cs.length*rowH+10;
 let ticks='';for(let t=15;t<=40;t+=5){ticks+=`<line x1="${x(t)}" y1="${top-8}" x2="${x(t)}" y2="${H-6}" stroke="var(--line)"/><text x="${x(t)}" y="${top-14}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}°</text>`}

  rows+=`<text x="0" y="${y+4}" font-size="13" fill="var(--ink)" font-family="IBM Plex Sans,sans-serif">${esc(c.name)}</text>
  <line x1="${x(c.w.lo)}" y1="${y}" x2="${x(c.w.hi)}" y2="${y}" stroke="${col}" stroke-width="10" stroke-linecap="round"/>
  <text x="${x(c.w.lo)-10}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${c.w.lo}°</text>
  <text x="${x(c.w.hi)+10}" y="${y+4}" font-size="11" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${c.w.hi}°</text>`});
 const rMax=250,rx=r=>left+r/rMax*(W-left-right-60);
 let rticks='';for(let r=0;r<=250;r+=50){rticks+=`<line x1="${rx(r)}" y1="${top-8}" x2="${rx(r)}" y2="${H-6}" stroke="var(--line)"/><text x="${rx(r)}" y="${top-14}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${r}</text>`}
 let rrows='';cs.forEach((c,i)=>{const y=top+i*rowH+rowH/2;
  rrows+=`<text x="0" y="${y+4}" font-size="13" fill="var(--ink)" font-family="IBM Plex Sans,sans-serif">${esc(c.name)}</text>
  <rect x="${left}" y="${y-8}" width="${Math.max(2,rx(c.w.rain)-left)}" height="16" rx="4" fill="var(--cobalt)" opacity=".85"/>
  <text x="${rx(c.w.rain)+8}" y="${y+4}" font-size="11" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${c.w.rain} mm · ${c.w.days} days</text>`});
 $('#v-weather').innerHTML=`
 <div style="max-width:70ch"><h2>What July feels like on this route</h2>
 <p class="note" style="margin-top:6px">Long-term averages for July. Every stop is hot and humid; the real differences are in rain and sunshine. Zhangjiajie and Guilin are the wettest, Xi’an the driest, Chengdu the mildest.</p></div>
 <div class="bgrid" style="margin-top:18px">
  <div class="chart" style="min-width:0"><div class="eyebrow" style="margin-bottom:6px">Daily low to high, °C</div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average July temperature range per city">${ticks}${rows}</svg></div>
  <div class="chart" style="min-width:0"><div class="eyebrow" style="margin-bottom:6px">Monthly rainfall, mm, and rainy days</div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average July rainfall per city">${rticks}${rrows}</svg></div>
 </div>
 <div class="wxcards">${cs.map(c=>`<article class="wxc">
   <div class="top"><h3 style="color:${CITY_COLORS[c.id]}">${esc(c.name)}</h3><span class="dates">${cityDates(c.id)}</span></div>
   <div class="wxnums"><div><div class="v">${c.w.lo}–${c.w.hi}°</div><div class="l">Low–high</div></div><div><div class="v">${c.w.rain}</div><div class="l">mm rain</div></div><div><div class="v">${c.w.days}</div><div class="l">Rainy days</div></div><div><div class="v">${c.w.hum}%</div><div class="l">Humidity</div></div></div>
   <p>${esc(c.w.feel)}</p>
   <p><span class="lab">Best hours</span>${esc(c.w.best)}</p>
   <p><span class="lab">Pack</span>${esc(c.w.wear)}</p></article>`).join('')}</div>
 <p class="src">Climate figures: Travel China Guide July weather pages for <a href="https://www.travelchinaguide.com/cityguides/xian/weather-july.htm" target="_blank" rel="noopener">Xi’an</a>, <a href="https://www.travelchinaguide.com/cityguides/sichuan/chengdu/weather-july.htm" target="_blank" rel="noopener">Chengdu</a>, <a href="https://www.travelchinaguide.com/cityguides/hunan/zhangjiajie/weather-july.htm" target="_blank" rel="noopener">Zhangjiajie</a>, <a href="https://www.travelchinaguide.com/cityguides/guangxi/guilin/weather-july.htm" target="_blank" rel="noopener">Guilin</a> and <a href="https://www.travelchinaguide.com/cityguides/shanghai/weather-july.htm" target="_blank" rel="noopener">Shanghai</a>; <a href="https://www.asiaodysseytravel.com/beijing/july-weather.html" target="_blank" rel="noopener">Asia Odyssey</a> for Beijing. These are averages, not forecasts.</p>`;

const TYPE_LABEL={family:'Family room',apartment:'Apartment',rooms:'Two rooms',custom:'Your pick'};

function stayRange(st){const r=stayNights().find(x=>x.st===st);if(!r)return '';const o={weekday:'short',day:'numeric',month:'short'};return dateOf(r.from).toLocaleDateString('en-GB',o)+' → '+dateOf(r.from+st.nights).toLocaleDateString('en-GB',o)}

    <div class="hfoot">

     <span class="htot num">${money(o.price*st.nights)}<small> for ${st.nights} night${st.nights===1?'':'s'}</small></span>
    </div>
    <div class="hactions">
     ${on?`<span class="pill-on">✓ Selected</span>`:`<button class="btn ghost hpick" data-s="${si}" data-id="${o.id}">Choose this hotel</button>`}

  return `<section class="stay" id="stay-${st.id}">

   <div class="arrlv"><span><b>Arrive</b> ${esc(st.arrive||'')}</span><span><b>Leave</b> ${esc(st.leave||'')}</span></div>
   <div class="hgrid">${cards||'<p class="muted">No option matches this filter. Show all to see the others.</p>'}</div>
   <details class="hadd"><summary>Add your own hotel for ${esc(st.name)}</summary>
    <form class="addform hform" data-s="${si}">
     <div class="row2"><div><label class="eyebrow" for="hn_${st.id}">Hotel name</label><input id="hn_${st.id}" required></div><div><label class="eyebrow" for="hu_${st.id}">Link (optional)</label><input id="hu_${st.id}" type="url" placeholder="https://"></div></div>
     <div class="row2"><div><label class="eyebrow" for="hpr_${st.id}">€ per night, all 4</label><input id="hpr_${st.id}" type="number" min="0" value="120"></div><div><label class="eyebrow" for="hs_${st.id}">Score /10 (optional)</label><input id="hs_${st.id}" type="number" min="0" max="10" step="0.1"></div></div>
     <button class="btn" type="submit">Add and select</button></form></details>
  </section>`}).join('');
 $('#v-hotels').innerHTML=`
 <div class="stat-row">
  <div class="stat"><div class="eyebrow">Hotels, ${nights} nights</div><div class="v num">${money(total)}</div></div>
  <div class="stat"><div class="eyebrow">Average per night</div><div class="v num">${money(total/Math.max(1,nights))}</div></div>
  <div class="stat"><div class="eyebrow">One room for all four</div><div class="v num">${fams} of ${S.stays.length} stays</div></div>
  <div class="stat"><div class="eyebrow">Average guest score</div><div class="v num">${avgScore}</div></div>
 </div>
 <div class="hbar">
  <div class="chips" role="group" aria-label="Filter hotels">
   <button class="chip ${hFilter==='all'?'on':''}" data-f="all">All options</button>
   <button class="chip ${hFilter==='family'?'on':''}" data-f="family">One room or apartment for 4</button>
   <button class="chip ${hFilter==='top'?'on':''}" data-f="top">Score 9.5 and up</button>
  </div>
  <label class="ctl" for="hSort">Sort <select id="hSort"><option value="rec">Recommended</option><option value="score">Highest score</option><option value="price">Lowest price</option></select></label>
 </div>
 <nav class="staynav" aria-label="Jump to a stay">${S.stays.map(st=>`<a href="#hotels" data-jump="${st.id}"><i style="background:${CITY_COLORS[st.city]}"></i>${esc(st.name)} <span class="num">${st.nights}n</span><b>${esc(selOpt(st).name)}</b></a>`).join('')}</nav>
 ${sections}
 <p class="src">Every option scored above 8 out of 10 on Trip.com or Booking.com when checked in November 2026; most score 9 or higher. Prices are our July estimates for the whole family per night, based on the platforms’ listed rates plus summer peak and a room for four. Edit any price to match the quote you get. Confirm that the room sleeps four adults before booking, and choose free cancellation while plans settle.</p>`;
 $('#hSort').value=hSort;
 document.querySelectorAll('#v-hotels .chip').forEach(b=>b.onclick=()=>{hFilter=b.dataset.f;renderHotels()});
 $('#hSort').onchange=e=>{hSort=e.target.value;renderHotels()};
 document.querySelectorAll('.hpick').forEach(b=>b.onclick=()=>{const st=S.stays[+b.dataset.s];st.sel=b.dataset.id;commit();toast(selOpt(st).name+' selected for '+st.name)});
 document.querySelectorAll('.hpin').forEach(el=>el.onchange=()=>{S.stays[+el.dataset.s].opts[+el.dataset.o].price=Math.max(0,+el.value||0);commit()});
 document.querySelectorAll('.hdel').forEach(b=>b.onclick=()=>{const st=S.stays[+b.dataset.s],o=st.opts.splice(+b.dataset.o,1)[0];if(st.sel===o.id)st.sel=st.opts[0].id;commit();toast('Removed '+o.name)});
 document.querySelectorAll('.nminus,.nplus').forEach(b=>b.onclick=()=>{const st=S.stays[+b.dataset.s];st.nights=Math.max(0,st.nights+(b.classList.contains('nplus')?1:-1));commit()});
 document.querySelectorAll('.hform').forEach(f=>f.onsubmit=e=>{e.preventDefault();const st=S.stays[+f.dataset.s];const g=k=>f.querySelector('#'+k+'_'+st.id).value.trim();
  const name=g('hn');if(!name)return;const url=g('hu');const id='c'+Date.now();
  st.opts.push({id,name,area:'Added by you',score:+g('hs')||null,src:url?'link':'',reviews:null,room:'Check that the room sleeps four',units:'',type:'custom',price:Math.max(0,+g('hpr')||0),access:[],why:'',url:/^https?:\/\//.test(url)?url:''});
  st.sel=id;commit();toast(name+' added and selected')});
 document.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById('stay-'+a.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});
}

/* ---------- Customise ---------- */
function renderCustomise(){
 $('#v-customise').innerHTML=`
 <div class="bgrid">
  <div style="min-width:0">
   <h2>Cities and nights</h2>
   <p class="note">Rename a city or change its stay area. Change nights on the Hotels tab, and day plans on the Day by day tab.</p>
   <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>City</th><th>Stay area</th><th class="n">Nights</th></tr></thead><tbody>
   ${S.cities.map((c,i)=>`<tr><td><input id="cn_${c.id}" data-i="${i}" data-f="name" value="${esc(c.name)}" style="width:120px;text-align:left"></td><td><input id="ca_${c.id}" data-i="${i}" data-f="area" value="${esc(c.area)}" style="width:100%;min-width:180px;text-align:left"></td><td class="n num">${c.nights}</td></tr>`).join('')}
   </tbody></table></div>
   <h3 style="margin-top:24px">Start date</h3>
   <p class="note">Every day shifts with it. A Saturday departure keeps the Forbidden City off a Monday.</p>
   <input id="cStart" type="date" value="${S.settings.start}" style="margin-top:8px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper)">
   <h3 style="margin-top:24px">Day titles</h3>
   <div class="tbl-wrap" style="margin-top:8px"><table><tbody>
   ${S.days.map((d,i)=>`<tr><td class="mono" style="white-space:nowrap">Day ${i+1}</td><td><input id="dt_${d.id}" data-d="${i}" value="${esc(d.title)}" style="width:100%;min-width:200px;text-align:left"></td></tr>`).join('')}
   </tbody></table></div>
  </div>
  <div style="min-width:0">
   <h2>Save and share your version</h2>
   <p class="note">Your changes are kept in this browser. To move them to another device or send them to the family, copy the plan below and paste it into the box on the other device.</p>
   <textarea class="json" id="exportBox" readonly aria-label="Plan data">${esc(JSON.stringify(S))}</textarea>
   <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn" id="copyBtn">Copy plan</button></div>
   <label for="importBox" class="eyebrow" style="display:block;margin-top:20px">Paste a plan to load it</label>
   <textarea class="json" id="importBox" style="min-height:110px;margin-top:6px"></textarea>
   <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn ghost" id="importBtn">Load pasted plan</button></div>
   <div class="panel" style="margin-top:24px"><h3>Start over</h3><p class="note" style="margin-top:0">Restores the original itinerary and budget. Your edits are lost.</p>
    <div style="margin-top:10px"><button class="btn warn" id="resetBtn">Reset to original</button> <span id="resetConfirm" hidden><button class="btn warn" id="resetYes">Yes, reset</button></span></div></div>
  </div>
 </div>`;
 document.querySelectorAll('#v-customise input[data-i]').forEach(el=>el.onchange=()=>{const c=S.cities[+el.dataset.i],f=el.dataset.f;c[f]=f==='nights'?Math.max(0,+el.value||0):el.value;commit()});
 document.querySelectorAll('#v-customise input[data-d]').forEach(el=>el.onchange=()=>{S.days[+el.dataset.d].title=el.value;commit()});
 $('#cStart').onchange=e=>{if(e.target.value){S.settings.start=e.target.value;commit()}};
 $('#copyBtn').onclick=()=>{const t=$('#exportBox');const ok=()=>toast('Plan copied');try{navigator.clipboard.writeText(t.value).then(ok).catch(()=>{t.select();toast('Selected. Press Ctrl or ⌘ + C')})}catch(e){t.select();toast('Selected. Press Ctrl or ⌘ + C')}};
 $('#importBtn').onclick=()=>{try{const d=JSON.parse($('#importBox').value);if(!d.days||!d.cities||!d.settings)throw 0;S=hydrate(d);commit();toast('Plan loaded')}catch(e){toast('That text is not a valid plan. Copy it again from the other device.')}};
 $('#resetBtn').onclick=()=>{$('#resetConfirm').hidden=false};
 $('#resetYes').onclick=()=>{S=hydrate(clone(DEFAULT));selDay=0;selCity=null;commit();toast('Original plan restored')};
}

/* ---------- shell ---------- */
const VIEWS={route:renderRoute,weather:renderWeather,days:renderDays,hotels:renderHotels,budget:renderBudget,essentials:renderEssentials,customise:renderCustomise};
function current(){const h=location.hash.replace('#','');return VIEWS[h]?h:'route'}
function show(){const v=current();Object.keys(VIEWS).forEach(k=>{$('#v-'+k).hidden=k!==v});document.querySelectorAll('nav.tabs a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.v===v)&&a.setAttribute('aria-current','page'));VIEWS[v]();renderHeader()}
function commit(keepView){syncNights(S);save();renderHeader();VIEWS[current()]()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
[['#cTravellers','travellers',1],['#cRate','rate',0.1],['#cFlight','flightPP',0]].forEach(([id,f,min])=>$(id).addEventListener('change',e=>{S.settings[f]=Math.max(min,+e.target.value||min);commit()}));
$('#cCur').addEventListener('change',e=>{S.settings.currency=e.target.value;commit()});
window.addEventListener('hashchange',show);
show();
</script>

</body>
